{% extends 'appointments/base.html' %}
{% block title %}Doctor Login - Medical Appointment{% endblock %}

{% block content %}
<div class="container py-5">
    <div class="row">
        <div class="col-md-5 mx-auto">
            <div class="card shadow-lg border-0">
                <div class="card-header bg-primary text-white text-center py-3">
                    <h4 class="mb-0"><i class="fas fa-user-md me-2"></i> Doctor Login</h4>
                </div>
                <div class="card-body p-4">
                    {% if form.errors %}
                    <div class="alert alert-danger">Incorrect doctor username or password.</div>
                    {% endif %}
                    <form method="post">
                        {% csrf_token %}
                        <div class="mb-3">
                            <label class="form-label">Doctor Username</label>
                            <input type="text" name="username" class="form-control" required autofocus>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Password</label>
                            <input type="password" name="password" class="form-control" required>
                        </div>
                        <input type="hidden" name="next" value="{{ next }}">
                        <div class="d-grid mt-4">
                            <button type="submit" class="btn btn-primary btn-lg">Login as Doctor</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
